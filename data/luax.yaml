mission: 
  info: THE MISSION
  title1: Keep the web
  title2: pure
  title3: like Lua itself.
  image: /img/lua-staticsitegenerator-new.webp
  description: We built Luax because modern SSGs feel like a maze of node_modules. Luax is different — one binary, markdown, LAX templates. The badger guards the burrow so you can just write.
  philosophy: 
    title: Floating Ruins Philosophy
    text: No bloat. Every byte must justify its existence, like stones in a floating archipelago.
  protocol: 
    title: Guardian Protocol
    text: Wise badger checks every build. If it smells like JavaScript, it gets buried.
  card: 
    title: Wise Guardian
    image: /img/luassg-staticsitegenerator.webp
    info: Protector of the burrow
  slogan: 
    title: What is LUAX
    text: Surreal speed. Real badger. Luax comes from "Luak" — which means "Badger" in Indonesian. A nocturnal creature, fast, silent, and efficient. Just like the way luax.axcora.com builds your site.

