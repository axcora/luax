terminal: 
  title: LUAX LUA SSG
  dot: PURE LUA
  info: "Luax: The Poetic Engine of Axcora"
  list: 
    - title: "I. The Birth of Light"
      text: "In the silence of the server's breath, Where Lua sleeps in ancient code, Axcora whispers through the mesh— Luax awakens, light as ode.No heavy chains, no bloat, no dread, Just pure and simple, fast as thought, Where static pages dance and spread, With every fiber finely wrought."
    - title: "II. The Canvas of Code"
      text: "Like JSX born in Lua's grace, Where HTML meets logic's art— Metaprogramming finds its place, And tags are handled from the start ,div and p, they breathe and sing, Components woven, tight and true, The parser works its magic thing— From Lua's womb, the pages grew."
    - title: "III. The Beauty of Simplicity"
      text: "No node_modules to weigh you down, No tangled web of dependency, Just light and speed in every town, A static site, pure poetry. SEO blooms without a care, Sitemaps woven, robots too, Luax builds them in the air— A craftsman's work, honest and true."
    - title: "IV. The Architect's Dream"
      text: "Seven hundred lines of parser grace, Three hundred more for magic's sake , A custom tongue, a sacred space, Where templates bend and structures break. For Lua's grammar fits the screen, A simple dance, a gentle art, No ambiguity, pristine— It plays its own harmonious part"
    - title: "V. The Final Verse"
      text: "So let the static pages fly, Built with love in every line, Luax whispers to the sky— Behold, this art is now divine.Axcora's child, Lua's flame, Where code and poetry entwine, Eternal in its humble frame— A masterpiece of design."
  command_title: INSTALL SEQUENCE
  command: 
    - cmd: git clone https://github.com/mesinkasir/luax.git
    - cmd: cd luax
    - cmd: luax build
    - cmd: luax start
  button: 
    text: RUN LUAX
    url: /starter/

