why: 
  info: WHY LUAX
  title1: Surreal speed.
  title2: Real
  title3: badger.
  build: 
    title: 12ms Build
    text: Compiles thousands of markdown files in milliseconds. No JS bundler lag.
  lua: 
    title: Pure Lua
    text: One binary. Zero dependencies. Runs anywhere Lua runs.
  templates: 
    title: LAX Templates
    text: Minimal syntax { { content } }, { % for % }. Familiar, fast, no magic.
  jamstack: 
    title: JAMSTACK Approved
    text: Perfectly compatible with the JAMSTACK architecture. YAML / JSON as Data Write content on markdown frontmatter ready.
  seo: 
    title: Tag & SEO
    text: Auto Collections, tags, RSS, Robots, Sitemap, Open Graph , Twitter Card . Built-in, not plugin hell.
  deploy: 
    title: Deploy Anywhere
    text: /public folder is static. Netlify, Vercel, AWS S3,Cloudflare, Github Pages , your burrow server.

